name: AO3Reader
options:
  bundleIdPrefix: com.aanugupta
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.2
targets:
  AO3Reader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AO3Reader
    info:
      path: AO3Reader/Info.plist
      properties:
        UILaunchScreen:
          UIImageName: ""
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
